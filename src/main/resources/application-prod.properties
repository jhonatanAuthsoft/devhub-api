spring.application.name=devhub-api
# Context path
server.servlet.context-path=/api
# ============================================================================
# DATABASE - Runtime Configuration (from ENV vars)
# ============================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.url=${DB_URL}
spring.flyway.user=${DB_USER}
spring.flyway.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.hikari.maximum-pool-size=35
spring.datasource.hikari.minimum-idle=15
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
# ============================================================================
# EMAIL - Runtime Configuration (OPTIONAL)
# ============================================================================
email.smtp.host=${EMAIL_SMTP_HOST:smtp.gmail.com}
email.smtp.port=${EMAIL_SMTP_PORT:587}
email.username=${EMAIL_USERNAME:}
email.password=${EMAIL_PASSWORD:}
email.smtp.auth=${EMAIL_SMTP_AUTH:true}
email.smtp.starttls.enable=${EMAIL_SMTP_STARTTLS_ENABLE:true}
email.smtp.ssl.trust=${EMAIL_SMTP_SSL_TRUST:*}
spring.jackson.time-zone=America/Sao_Paulo
spring.datasource.time-zone=America/Sao_Paulo
# ============================================================================
# ACTUATOR - SECURE (only essential endpoints)
# ============================================================================
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.info.env.enabled=true
info.app.name=@project.name@
info.app.description=@project.description@
info.app.version=@project.version@
jwt.secret=${JWT_SECRET}
# Production logging
logging.level.root=INFO
logging.level.com.projeto=INFO
logging.level.org.springframework=WARN

# ============================================================================
# AWS S3 - Runtime Configuration
# ============================================================================
aws.s3.bucket=${AWS_S3_BUCKET}
aws.s3.region=${AWS_REGION:us-east-1}
aws.s3.public-endpoint=${AWS_S3_PUBLIC_ENDPOINT:https://${AWS_S3_BUCKET}.s3.${AWS_REGION:us-east-1}.amazonaws.com}

# As credenciais são opcionais em prod, pois a AWS pode usar IAM Roles automaticamente
aws.accessKeyId=${AWS_ACCESS_KEY_ID:}
aws.secretKey=${AWS_SECRET_ACCESS_KEY:}

# Endpoint vazio por padrão em prod (usa o endpoint oficial da AWS)
aws.s3.endpoint=${AWS_S3_ENDPOINT:}
