name: Deploy Production

on:
  push:
    branches:
      - main

env:
  DOCKER_IMAGE: comercialauthsoft/devhub-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"

      - name: Extract version from pom.xml
        id: get_version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Run tests and build
        run: mvn verify -B

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:v${{ steps.get_version.outputs.VERSION }}
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:latest
          cache-to: type=inline
          build-args: |
            VERSION=${{ steps.get_version.outputs.VERSION }}

      - name: Image digest
        run: |
          echo "Images pushed:"
          echo "  - ${{ env.DOCKER_IMAGE }}:latest"
          echo "  - ${{ env.DOCKER_IMAGE }}:v${{ steps.get_version.outputs.VERSION }}"
          echo "  - ${{ env.DOCKER_IMAGE }}:${{ github.sha }}"
