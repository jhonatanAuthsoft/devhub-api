# ============================================================================
# APPLICATION SETTINGS
# ============================================================================
spring.application.name=devhub-api

# Context path for all API endpoints
server.servlet.context-path=/api

# ============================================================================
# DATABASE CONFIGURATION
# ============================================================================
# Runtime configuration from ENV vars (set via Kubernetes ConfigMap/Secrets)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devhub}
spring.datasource.username=${DB_USER:devhub_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool settings
spring.datasource.hikari.maximum-pool-size=35
spring.datasource.hikari.minimum-idle=15
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# ============================================================================
# FLYWAY MIGRATION
# ============================================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.url=${DB_URL:jdbc:postgresql://localhost:5432/devhub}
spring.flyway.user=${DB_USER:devhub_user}
spring.flyway.password=${DB_PASSWORD:}

# ============================================================================
# JPA / HIBERNATE
# ============================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ============================================================================
# TIMEZONE
# ============================================================================
spring.jackson.time-zone=America/Sao_Paulo
spring.datasource.time-zone=America/Sao_Paulo

# ============================================================================
# SECURITY - JWT
# ============================================================================
jwt.secret=${JWT_SECRET:dev-secret-key-change-in-production}

# ============================================================================
# ACTUATOR CONFIGURATION (SECURE)
# ============================================================================
# Base path for actuator endpoints
management.endpoints.web.base-path=/actuator

# Only expose essential endpoints (health, info, metrics)
# NEVER expose shutdown, env, beans, etc. in production!
management.endpoints.web.exposure.include=health,info,metrics

# Health endpoint details
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

# Separate liveness and readiness probes
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Info endpoint
management.info.env.enabled=true
info.app.name=@project.name@
info.app.description=@project.description@
info.app.version=@project.version@

# ============================================================================
# SERVER CONFIGURATION
# ============================================================================
# Server port (can be overridden by SERVER_PORT env var)
server.port=${SERVER_PORT:8080}

# Graceful shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ============================================================================
# LOGGING (Production)
# ============================================================================
logging.level.root=INFO
logging.level.com.projeto=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

# Log pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
